name: CI

on: [push, pull_request]

permissions: {}

jobs:
  lint-actions:
    name: GitHub Actions audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@b1d7e1fb5de872772f31590499237e7cce841e8e # v0.5.3
        with:
          advanced-security: false

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["2.6", "2.7", "3.0", "3.1", "3.2"]
        rails-version: ["5.2.0", "6.0.0", "6.1.0"]
        exclude:
          # Rails 5.2 does not support Ruby 3.0
          - {ruby-version: "3.0", rails-version: "5.2.0"}
          - {ruby-version: "3.1", rails-version: "5.2.0"}
          - {ruby-version: "3.2", rails-version: "5.2.0"}

    services:
      mysql:
        image: mysql # zizmor: ignore[unpinned-images] -- version tag is fine for service containers
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306:3306
      postgres:
        image: postgres # zizmor: ignore[unpinned-images] -- version tag is fine for service containers
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432

    env:
      RAILS_VERSION: ${{ matrix.rails-version }}
      MYSQL_HOST: 127.0.0.1
      PGHOST: 127.0.0.1
      DB_HOST: 127.0.0.1

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - uses: ruby/setup-ruby@4c56a21280b36d862b5fc31348f463d60bdc55d5 # v1.301.0
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Run tests
      run: bundle exec rake db:reset test:all

